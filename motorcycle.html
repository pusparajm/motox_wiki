<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Motorcycle specifications, torque values, oil capacity, seat height and weight on MotoX Wiki.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://motoxref.com/">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="MotoX Wiki">
  <meta property="og:title" content="Motorcycle Specifications — MotoX Wiki">
  <meta property="og:description" content="Specifications, torque values, oil capacity, seat height and weight.">
  <meta property="og:url" content="https://motoxref.com/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Motorcycle Specifications — MotoX Wiki">
  <meta name="twitter:description" content="Specifications, torque values, oil capacity, seat height and weight.">
  <meta name="theme-color" content="#c2410c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Motorcycle Specifications — MotoX Wiki</title>
  <link rel="stylesheet" href="css/site.min.css?v=3" id="mx-main-css" data-mx-shield-css="css/main.css?v=32" fetchpriority="high">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3716738858398465"
     crossorigin="anonymous"></script>
</head>
<body>
  <div class="site-top">
    <header data-mx-ref="site-header" class="site-header"></header>
    <div class="site-ad-bar" data-mx-ref="site-ad-bar"></div>
  </div>

  <main class="container" data-mx-ref="main-content" data-mx-shield="light">
    <div class="loading">Loading…</div>
  </main>

  <footer data-mx-ref="site-footer" class="site-footer"></footer>

  <script defer src="js/dist/shield.js?v=16"></script>
  <script defer src="js/dist/core.js?v=32"></script>
  <script defer src="js/dist/search.js?v=12"></script>
  <script>
    function setStructuredData(bike) {
      const existing = document.getElementById('mx-jsonld');
      if (existing) existing.remove();
      const spec = key => MotoX.getGeneralField(bike, key);
      const quantity = (value, unitCode) => {
        const num = parseFloat(String(value || '').replace(/,/g, ''));
        return Number.isFinite(num) ? { '@type': 'QuantitativeValue', value: num, unitCode } : (value || undefined);
      };
      const fuel = spec('fuel_capacity') || '';
      const pageUrl = `https://motoxref.com/motorcycle/${encodeURIComponent(bike.id)}.html`;
      const faq = MotoX.getBikeFaq(bike).map(item => ({
        '@type': 'Question',
        name: item.q,
        acceptedAnswer: { '@type': 'Answer', text: item.a }
      }));
      const graph = [{
        '@type': 'Motorcycle',
        name: MotoX.formatBikeTitle(bike),
        brand: { '@type': 'Brand', name: bike.make },
        model: bike.model,
        vehicleModelDate: bike.year,
        description: bike.summary || undefined,
        bodyType: bike.category || undefined,
        weight: quantity(spec('weight'), 'KGM'),
        fuelCapacity: quantity(fuel, /kwh/i.test(fuel) ? 'KWH' : 'LTR'),
        vehicleEngine: {
          '@type': 'EngineSpecification',
          engineDisplacement: quantity(bike.displacement, 'CMQ'),
          enginePower: quantity(spec('power'), 'BHP'),
          engineTorque: quantity(spec('torque'), 'NU')
        },
        url: pageUrl
      }, {
        '@type': 'BreadcrumbList',
        itemListElement: [
          { '@type': 'ListItem', position: 1, name: 'Home', item: 'https://motoxref.com/' },
          { '@type': 'ListItem', position: 2, name: 'Browse', item: 'https://motoxref.com/#browse' },
          { '@type': 'ListItem', position: 3, name: MotoX.formatBikeTitle(bike), item: pageUrl }
        ]
      }];
      if (faq.length) {
        graph.push({ '@type': 'FAQPage', mainEntity: faq });
      }
      const data = { '@context': 'https://schema.org', '@graph': graph };
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.id = 'mx-jsonld';
      script.textContent = JSON.stringify(data);
      document.head.appendChild(script);

      let canonical = document.querySelector('link[rel="canonical"]');
      if (!canonical) {
        canonical = document.createElement('link');
        canonical.rel = 'canonical';
        document.head.appendChild(canonical);
      }
      canonical.href = pageUrl;

      const setMeta = (selector, value) => {
        const el = document.querySelector(selector);
        if (el && value) el.setAttribute('content', value);
      };
      setMeta('meta[property="og:title"]', MotoX.formatBikeTitle(bike));
      setMeta('meta[property="og:description"]', bike.summary || '');
      setMeta('meta[property="og:url"]', pageUrl);
      setMeta('meta[name="twitter:title"]', MotoX.formatBikeTitle(bike));
      setMeta('meta[name="twitter:description"]', bike.summary || '');
    }

    async function init() {
      const settings = await MotoX.initLayout('motorcycle.html');
      MotoXSearch.init({ lazy: true, settings });
      const m = MotoX.mx;

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        MotoX.setContainerHtml(MotoX.ref('main-content'), `
          <div class="${m('empty-state')}">
            <p>No motorcycle specified.</p>
            <p><a href="index.html">Browse all motorcycles</a></p>
          </div>
        `);
        return;
      }

      const [bike, index] = await Promise.all([
        MotoX.loadMotorcycle(id),
        MotoX.loadMotorcycleIndex().catch(() => [])
      ]);

      if (!bike) {
        MotoX.setContainerHtml(MotoX.ref('main-content'), `
          <div class="${m('empty-state')}">
            <p>Motorcycle not found.</p>
            <p><a href="index.html">Browse all motorcycles</a></p>
          </div>
        `);
        document.title = 'Not Found — MotoX Wiki';
        return;
      }

      const power = MotoX.getGeneralField(bike, 'power');
      const torque = MotoX.getGeneralField(bike, 'torque');
      const weight = MotoX.getGeneralField(bike, 'weight');
      const seat = MotoX.getGeneralField(bike, 'seat_height');
      const oil = MotoX.getServiceField(bike, 'oil_capacity');
      const seoTitle = `${bike.make} ${bike.model} (${bike.year}) Specs & Torque`;
      document.title = `${seoTitle} | MotoX Wiki`;
      const short = value => String(value || '').split('@')[0].replace(/\([^)]*\)/g, '').trim();
      const descBits = [];
      if (power) descBits.push(`${short(power)} power`);
      if (torque) descBits.push(`${short(torque)} torque`);
      if (weight) descBits.push(`${weight}`);
      if (seat) descBits.push(`${seat} seat`);
      if (oil) descBits.push(`${short(oil)} oil`);
      document.querySelector('meta[name="description"]').content =
        `${bike.make} ${bike.model} specs: ${descBits.join(', ')}. Torque values, service data and dimensions.`;
      setStructuredData(bike);

      const detailHtml = MotoX.renderMotorcycleDetail(bike, settings);
      const relatedHtml = MotoX.renderRelatedModels(bike, index);
      MotoX.setContainerHtml(MotoX.ref('main-content'), `${detailHtml}${relatedHtml}`);
    }

    document.addEventListener('DOMContentLoaded', () => {
      MotoXShield.bootstrap().then(() => init());
    });
  </script>
</body>
</html>
