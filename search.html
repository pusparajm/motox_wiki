<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Search motorcycles and technical specifications on MotoX Wiki.">
  <meta name="robots" content="noindex,follow">
  <title>Search — MotoX Wiki</title>
  <link rel="stylesheet" href="css/site.min.css?v=3" id="mx-main-css" data-mx-shield-css="css/main.css?v=32" fetchpriority="high">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3716738858398465"
     crossorigin="anonymous"></script>
</head>
<body>
  <div class="site-top">
    <header data-mx-ref="site-header" class="site-header"></header>
    <div class="site-ad-bar" data-mx-ref="site-ad-bar">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-3716738858398465"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
  </div>

  <main class="container">
    <h1>Search Results</h1>
    <p data-mx-ref="search-query-display"></p>
    <div data-mx-ref="search-results" data-mx-shield="light"><div class="loading">Loading search index…</div></div>
  </main>

  <footer data-mx-ref="site-footer" class="site-footer"></footer>

  <script defer src="js/dist/shield.js?v=16"></script>
  <script defer src="js/dist/core.js?v=32"></script>
  <script defer src="js/dist/search.js?v=12"></script>
  <script>
    async function init() {
      const settings = await MotoX.initLayout('search.html');
      MotoXSearch.init({ lazy: true, settings });
      const m = MotoX.mx;

      const params = new URLSearchParams(window.location.search);
      const q = params.get('q') || '';

      MotoX.ref('search-query-display').textContent =
        q ? `Showing results for "${q}"` : 'Enter a search term using the header search bar.';

      const container = MotoX.ref('search-results');

      if (!q) {
        MotoX.setContainerHtml(container,
          `<div class="${m('empty-state')}">
            <p>Search by model name, nickname or engine size — for example “CBR 600”, “Fireblade”, “Busa” or “MT-07”.</p>
            <div class="${m('search-suggestions')}">${MotoXSearch.suggestions(8).map(s => `<a class="${m('search-suggestion')}" href="search.html?q=${encodeURIComponent(s)}">${MotoX.escapeHtml(s)}</a>`).join('')}</div>
          </div>`
        );
        return;
      }

      await MotoXSearch.ensureIndex();
      const results = MotoXSearch.search(q, settings.search?.maxResults || 50);

      if (!results.length) {
        MotoX.setContainerHtml(container, `<div class="${m('empty-state')}">
          <p><strong>No results for “${MotoX.escapeHtml(q)}”</strong></p>
          <p class="${m('search-tip')}">Try a model name, nickname or engine size. For example “CBR 600”, “Fireblade”, “Busa” or “MT-07”.</p>
          <div class="${m('search-suggestions')}">${MotoXSearch.suggestions(8).map(s => `<a class="${m('search-suggestion')}" href="search.html?q=${encodeURIComponent(s)}">${MotoX.escapeHtml(s)}</a>`).join('')}</div>
        </div>`);
        return;
      }

      MotoX.setContainerHtml(container, `
        <div class="${m('page-list')}">
          ${results.map(r => MotoX.renderPageItem(
            r.url,
            r.title,
            `${r.type === 'motorcycle' ? '🏍 Motorcycle' : '📄 Wiki Page'} — ${[r.meta, r.power].filter(Boolean).join(' · ')}`,
            r.title
          )).join('')}
        </div>
      `);
    }

    document.addEventListener('DOMContentLoaded', () => {
      MotoXShield.bootstrap().then(() => init());
    });
  </script>
</body>
</html>
